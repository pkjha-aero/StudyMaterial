# Course names and topic lists for the published catalog.
#
# Hand-maintained: build_catalog.py never writes to this file, so re-scanning the
# drive will not clobber anything here. render_catalog.py merges it over the
# generated index.
#
# Fill `name` with what the course is, and `topics` with what it covers. Topics are
# the point — the site publishes what material covers, not what files it contains.
# Entries left blank render as a dash and are counted as unnamed on the page.
#
# `source:` records where the name came from — `syllabus` if read off a course document
# in the folder, `inferred` if deduced from directory and file names. Deliberately no
# instructor field either way.
