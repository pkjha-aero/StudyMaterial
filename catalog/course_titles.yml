# drive will not clobber anything here. render_catalog.py merges it over the
# generated index.
#
# Fill `name` with what the course is, and `topics` with what it covers. Topics are
# the point — the site publishes what material covers, not what files it contains.
# Entries left blank render as a dash and are counted as unnamed on the page.
#
# Deliberately no instructor field.

