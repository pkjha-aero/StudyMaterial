# Where the coursework archive lives. Overridden by --root on the command line,
# so the scripts keep working when the drive is mounted somewhere else.
archive_root: /media/pkjha/PKJ_MyPassport/Repository/Academic/CourseWork

# Course-code prefix -> department, for files that sit loose at the archive root rather
# than inside a department directory. Without this they are simply not catalogued.
code_department_map:
  METEO: Meteorology
  ATOC:  Meteorology
  ESCI:  Meteorology
  PHYS:  Physics
  AOE:   Aerospace
  E_MCH: Mechanical

# Department directory -> the site section its material feeds.
section_map:
  Aerospace:  aerospace
  Mechanical: fluids
  Astro:      astrophysics
  Maths:      foundations
  CSE:        computing
  Chemistry:  foundations
  Others:     fluids
  Meteorology: meteorology
  Physics:     foundations
