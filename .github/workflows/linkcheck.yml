name: Link check

# External links rot silently. Internal links are already covered by
# `mkdocs build --strict` on every PR, so this job only has to watch the
# outward-facing ones — monthly is plenty, and it must never block a merge.
on:
  schedule:
    - cron: "0 6 1 * *"     # 06:00 UTC, first of the month
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install toolchain
        run: pip install -r requirements.txt

      - name: Build
        run: mkdocs build --strict

      - name: Check links
        id: lychee
        continue-on-error: true      # advisory only
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 2
            --accept 200,206,403,429
            --exclude-path site/404.html
            'site/**/*.html'
          fail: true

      - name: Summarise
        if: steps.lychee.outcome == 'failure'
        run: |
          echo "### Broken links found" >> "$GITHUB_STEP_SUMMARY"
          echo "See the lychee step output above." >> "$GITHUB_STEP_SUMMARY"
